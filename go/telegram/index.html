<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Переход в Telegram</title>
    <script>
        (function () {
            var BOT_USERNAME = "stas_hrybovskyiP2Pbot";
            var alphabet = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

            function randomId() {
                var bytes = new Uint8Array(10);
                if (window.crypto && window.crypto.getRandomValues) {
                    window.crypto.getRandomValues(bytes);
                } else {
                    for (var i = 0; i < bytes.length; i += 1) {
                        bytes[i] = Math.floor(Math.random() * 255);
                    }
                }

                var id = "c";
                for (var j = 0; j < bytes.length; j += 1) {
                    id += alphabet[bytes[j] % alphabet.length];
                }
                return id;
            }

            function sanitizeSource(value) {
                return (value || "")
                    .replace(/[\s-]+/g, "_")
                    .replace(/[^a-zA-Z0-9_]/g, "")
                    .replace(/_+/g, "_")
                    .replace(/^_+|_+$/g, "")
                    .slice(0, 40) || "prelend";
            }

            function sanitizePayload(value) {
                return (value || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 64);
            }

            function trackClick(params, source, clickId) {
                var endpoint = window.PRELEND_TRACK_ENDPOINT || "";
                if (!endpoint || !window.navigator || !window.navigator.sendBeacon) {
                    return;
                }

                var payload = {
                    event: "tg_click",
                    timestamp: new Date().toISOString(),
                    source: source,
                    src: source,
                    click_id: clickId,
                    visitor_id: params.get("visitor_id") || "",
                    utm_source: params.get("utm_source") || "",
                    utm_campaign: params.get("utm_campaign") || "",
                    utm_adset: params.get("utm_adset") || "",
                    utm_ad: params.get("utm_ad") || "",
                    utm_placement: params.get("utm_placement") || "",
                    fbclid: params.get("fbclid") || "",
                    page_url: params.get("page_url") || document.referrer || "",
                    user_agent: window.navigator.userAgent
                };
                var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
                window.navigator.sendBeacon(endpoint, blob);
            }

            var params = new URLSearchParams(window.location.search);
            var source = sanitizeSource(
                params.get("source") ||
                params.get("src") ||
                params.get("funnel") ||
                params.get("utm_campaign") ||
                params.get("utm_source")
            );
            var clickId = sanitizePayload(params.get("click_id"));
            if (!clickId) {
                clickId = "pl_" + source + "__" + randomId().replace(/^c/, "");
            }
            trackClick(params, source, clickId);
            var target = "https://t.me/" + BOT_USERNAME + "?start=" + encodeURIComponent(clickId);
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Переходим в Telegram...</p>
</body>
</html>
