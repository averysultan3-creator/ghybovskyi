<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Переход в Telegram</title>
    <script>
        (function () {
            var BOT_USERNAME = "stas_hrybovskyiP2Pbot";
            var TRACK_KEYS = ["visitor_id", "utm_source", "utm_campaign", "utm_adset", "utm_ad", "utm_placement", "fbclid", "page_url"];

            function sanitizeSource(value) {
                return (value || "")
                    .toLowerCase()
                    .replace(/[а-яё]/gi, "")
                    .replace(/[\s/|]+/g, "_")
                    .replace(/[^a-z0-9_-]/g, "")
                    .replace(/[-_]{2,}/g, "_")
                    .replace(/^[-_]+|[-_]+$/g, "")
                    .slice(0, 40) || "unknown";
            }

            function sanitizeClickId(value) {
                return (value || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
            }

            function randomId() {
                var alphabet = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
                var bytes = new Uint8Array(10);
                if (window.crypto && window.crypto.getRandomValues) {
                    window.crypto.getRandomValues(bytes);
                } else {
                    for (var i = 0; i < bytes.length; i += 1) {
                        bytes[i] = Math.floor(Math.random() * 255);
                    }
                }
                var id = "";
                for (var j = 0; j < bytes.length; j += 1) {
                    id += alphabet[bytes[j] % alphabet.length];
                }
                return id;
            }

            function getTrackEndpoint() {
                var params = new URLSearchParams(window.location.search);
                if (params.get("track")) {
                    return params.get("track");
                }
                if (window.PRELEND_TRACK_ENDPOINT) {
                    return window.PRELEND_TRACK_ENDPOINT;
                }
                if (window.PRELEND_RUNTIME_CONFIG && window.PRELEND_RUNTIME_CONFIG.trackEndpoint) {
                    return window.PRELEND_RUNTIME_CONFIG.trackEndpoint;
                }
                var meta = document.querySelector('meta[name="prelend-track-endpoint"]');
                if (meta && meta.content) {
                    return meta.content;
                }
                return "";
            }

            function trackClick(params, source, clickId) {
                if (params.get("tg_click_sent") === "1") {
                    return;
                }
                var endpoint = getTrackEndpoint();
                if (!endpoint) {
                    console.warn("[prelend] tracking endpoint is not configured, tg_click fallback skipped");
                    return;
                }

                var payload = {
                    event: "tg_click",
                    timestamp: new Date().toISOString(),
                    source: source,
                    src: source,
                    click_id: clickId,
                    user_agent: window.navigator.userAgent
                };
                TRACK_KEYS.forEach(function (key) {
                    if (params.get(key)) {
                        payload[key] = params.get(key);
                    }
                });

                var body = JSON.stringify(payload);
                if (window.navigator.sendBeacon) {
                    var blob = new Blob([body], { type: "application/json" });
                    if (window.navigator.sendBeacon(endpoint, blob)) {
                        return;
                    }
                }

                try {
                    fetch(endpoint, {
                        method: "POST",
                        mode: "cors",
                        headers: { "Content-Type": "application/json" },
                        body: body,
                        keepalive: true
                    }).catch(function (error) {
                        console.warn("[prelend] tg_click fallback failed:", error);
                    });
                } catch (error) {
                    console.warn("[prelend] tg_click fetch failed:", error);
                }
            }

            var params = new URLSearchParams(window.location.search);
            var source = sanitizeSource(
                params.get("source") ||
                params.get("src") ||
                params.get("funnel") ||
                params.get("utm_campaign") ||
                params.get("utm_source")
            );
            var clickId = sanitizeClickId(params.get("click_id"));
            if (!clickId) {
                clickId = "pl_" + source + "__" + randomId();
            }
            trackClick(params, source, clickId);
            var target = "https://t.me/" + BOT_USERNAME + "?start=" + encodeURIComponent(clickId);
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Переходим в Telegram...</p>
</body>
</html>
